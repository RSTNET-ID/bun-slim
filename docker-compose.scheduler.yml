# DEVELOPMENT-ONLY scheduler overlay.
# Register at least one task in src/scheduler/registry.ts before enabling this profile.
services:
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 25s
    mem_limit: 256m
    cpus: 0.5
    command: ["./scheduler"]
    environment:
      APP_ENV: development
      TZ: UTC
      SERVICE_NAME: example-service
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 15000
      PROCESS_HEALTH_PORT: 9465
      DB_DRIVER: mysql
      DATABASE_URL: mysql://user:password@mysql:3306/example_service
      DB_POOL_MAX: 5
      DB_PREPARE: "true"
      DB_TLS_MODE: disable
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9465/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
