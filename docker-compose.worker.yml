# DEVELOPMENT-ONLY worker overlay. Production must inject real secrets and network policy.
services:
  app:
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 512m
    cpus: 1.0
    command: ["./worker"]
    environment:
      APP_ENV: development
      TZ: UTC
      SERVICE_NAME: example-service
      LOG_LEVEL: info
      PROCESS_HEALTH_PORT: 9465
      DB_DRIVER: mysql
      DATABASE_URL: mysql://user:password@mysql:3306/example_service
      DB_POOL_MAX: 10
      DB_PREPARE: "true"
      DB_TLS_MODE: disable
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
      WORKER_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      WORKER_QUEUE_NAME: default
      WORKER_QUEUE_PREFIX: queue
      WORKER_CONCURRENCY: 2
      WORKER_BLOCK_MS: 1000
      WORKER_JOB_TIMEOUT_MS: 30000
      WORKER_MAX_ATTEMPTS: 3
      WORKER_RETRY_BACKOFF_MS: 1000
      WORKER_STALE_AFTER_MS: 60000
      WORKER_RECLAIM_INTERVAL_MS: 15000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9465/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
