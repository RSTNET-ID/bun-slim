services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ENV: development
      SERVICE_NAME: example-service
      PORT: 3000
      LOG_LEVEL: info
      SERVER_HOST: 0.0.0.0
      SERVER_IDLE_TIMEOUT_SECONDS: 15
      MAX_REQUEST_BODY_BYTES: 1048576
      SHUTDOWN_TIMEOUT_MS: 15000
      SECURITY_HEADERS_ENABLED: "true"
      METRICS_ENABLED: "false"
      OUTBOUND_HTTP_TIMEOUT_MS: 5000
      OUTBOUND_HTTP_MAX_RETRIES: 2
      OUTBOUND_HTTP_RETRY_BASE_MS: 100
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@postgres:5432/example_service
      DB_POOL_MAX: 10
      DB_IDLE_TIMEOUT_SECONDS: 30
      DB_CONNECTION_TIMEOUT_SECONDS: 10
      DB_MAX_LIFETIME_SECONDS: 0
      DB_PREPARE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: example_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d example_service"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
