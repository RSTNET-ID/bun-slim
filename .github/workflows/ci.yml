name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Production dependency audit
        run: bun run audit:prod

      - name: Unit and contract tests
        run: bun run test

      - name: Build standalone binary
        run: bun run build

      - name: Release readiness
        run: bun run release:check

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: example_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d example_service"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      TZ: UTC
      SERVICE_NAME: bun-slim-ci
      LOG_LEVEL: warn
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@127.0.0.1:5432/example_service
      DB_POOL_MAX: 5
      DB_PREPARE: "true"
      RUN_POSTGRES_INTEGRATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run migrate:up

      - name: Seed reference data
        run: bun run seed

      - name: PostgreSQL integration tests
        run: bun run test:integration

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      APP_ENV: test
      SERVICE_NAME: bun-slim-ci
      LOG_LEVEL: warn
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@127.0.0.1:5432/unused
      REDIS_URL: redis://127.0.0.1:6379
      RUN_REDIS_INTEGRATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile

      - name: Redis integration tests
        run: bun run test:integration

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Compose
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.worker.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.scheduler.yml config >/dev/null

      - name: Build production image
        run: docker build --pull -t bun-slim:ci .


      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bun-slim:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: bun-slim:ci
          artifact-name: bun-slim-image.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Verify non-root runtime user
        run: |
          uid="$(docker run --rm --entrypoint id bun-slim:ci -u)"
          test "$uid" != "0"

      - name: Smoke test liveness
        run: |
          docker run -d --name bun-slim-ci             -p 127.0.0.1:3000:3000             -e APP_ENV=test             -e DATABASE_URL=postgres://user:password@127.0.0.1:5432/unused             bun-slim:ci

          trap 'docker rm -f bun-slim-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs bun-slim-ci
          exit 1
