name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and contract tests
        run: bun run test

      - name: Build standalone binary
        run: bun run build

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: example_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d example_service"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      SERVICE_NAME: bun-slim-ci
      LOG_LEVEL: warn
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@127.0.0.1:5432/example_service
      DB_POOL_MAX: 5
      DB_PREPARE: "true"
      RUN_POSTGRES_INTEGRATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run migrate:up

      - name: PostgreSQL integration tests
        run: bun run test:integration

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      APP_ENV: test
      SERVICE_NAME: bun-slim-ci
      LOG_LEVEL: warn
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@127.0.0.1:5432/unused
      REDIS_URL: redis://127.0.0.1:6379
      RUN_REDIS_INTEGRATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile

      - name: Redis integration tests
        run: bun run test:integration
