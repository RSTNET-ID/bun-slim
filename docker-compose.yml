version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=development
      - SERVICE_NAME=example-service
      - PORT=3000
      - LOG_LEVEL=info
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://user:password@postgres:5432/example_service
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: example_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d example_service"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
