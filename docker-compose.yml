# DEVELOPMENT-ONLY compose baseline. Do not deploy this file unchanged to production.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 25s
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ENV: development
      TZ: UTC
      SERVICE_NAME: example-service
      PORT: 3000
      LOG_LEVEL: info
      SERVER_HOST: 0.0.0.0
      SERVER_IDLE_TIMEOUT_SECONDS: 15
      MAX_REQUEST_BODY_BYTES: 1048576
      SHUTDOWN_TIMEOUT_MS: 15000
      SHUTDOWN_DRAIN_DELAY_MS: 1000
      SECURITY_HEADERS_ENABLED: "true"
      METRICS_ENABLED: "false"
      PROCESS_HEALTH_PORT: 9465
      EXAMPLE_ROUTES_ENABLED: "true"
      OUTBOUND_HTTP_TIMEOUT_MS: 5000
      OUTBOUND_HTTP_MAX_RETRIES: 2
      OUTBOUND_HTTP_RETRY_BASE_MS: 100
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@postgres:5432/example_service
      DB_POOL_MAX: 10
      DB_IDLE_TIMEOUT_SECONDS: 30
      DB_CONNECTION_TIMEOUT_SECONDS: 10
      DB_MAX_LIFETIME_SECONDS: 0
      DB_PREPARE: "true"
      DB_TLS_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["./migrate", "up"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      APP_ENV: development
      TZ: UTC
      SERVICE_NAME: example-service
      LOG_LEVEL: info
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@postgres:5432/example_service
      DB_POOL_MAX: 2
      DB_PREPARE: "true"
      DB_TLS_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["./seed", "run"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      APP_ENV: development
      TZ: UTC
      SERVICE_NAME: example-service
      LOG_LEVEL: info
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@postgres:5432/example_service
      DB_POOL_MAX: 2
      DB_PREPARE: "true"
      DB_TLS_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      TZ: UTC
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: example_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d example_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
