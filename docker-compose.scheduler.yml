# DEVELOPMENT-ONLY scheduler overlay.
# Register at least one task in src/scheduler/registry.ts before enabling this profile.
services:
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["./scheduler"]
    environment:
      APP_ENV: development
      TZ: UTC
      SERVICE_NAME: example-service
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 15000
      DB_DRIVER: postgres
      DATABASE_URL: postgres://user:password@postgres:5432/example_service
      DB_POOL_MAX: 5
      DB_PREPARE: "true"
      SCHEDULER_ENABLED: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
